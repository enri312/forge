name: 🔥 FORGE CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  # ── Tests y Build ──────────────────────────────────────────
  build:
    name: 🔨 Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 🦀 Instalar Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-25
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: 💾 Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Setup Node.js (Dashboard HTML)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: forge-dashboard/package-lock.json

      - name: ⚡ Compilar Dashboard Frontend
        working-directory: forge-dashboard
        run: |
          npm ci
          npm run lint
          npm audit --audit-level=moderate
          npm run build

      - name: 🔨 Build
        run: cargo build --workspace

      - name: 🧪 Tests
        run: cargo test --workspace

      - name: 📋 Clippy (linter)
        run: cargo clippy --workspace -- -D warnings

      - name: 🎨 Formato
        run: cargo fmt --all -- --check

  # ── Cadena de suministro ───────────────────────────────────
  supply-chain:
    name: 🔐 Audit & SBOM
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: 🦀 Instalar Rust estable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-25
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            forge-dashboard/package-lock.json
            editors/vscode/package-lock.json

      - name: 🔎 Auditar dependencias Rust
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --deny warnings

      - name: 🔎 Auditar Dashboard
        working-directory: forge-dashboard
        run: |
          npm ci
          npm audit --audit-level=moderate

      - name: 🔎 Auditar extensión VS Code
        working-directory: editors/vscode
        run: |
          npm ci
          npm audit --audit-level=moderate

      - name: 📋 Generar SBOM Rust (CycloneDX)
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --format json --spec-version 1.5

      - name: 📋 Generar SBOM Dashboard (CycloneDX)
        working-directory: forge-dashboard
        run: |
          mkdir -p ../sbom
          npx --yes @cyclonedx/cyclonedx-npm@5.0.0 --package-lock-only --ignore-npm-errors --output-reproducible --output-file ../sbom/forge-dashboard.cdx.json

      - name: 📋 Generar SBOM extensión VS Code (CycloneDX)
        working-directory: editors/vscode
        run: |
          mkdir -p ../../sbom
          npx --yes @cyclonedx/cyclonedx-npm@5.0.0 --package-lock-only --ignore-npm-errors --output-reproducible --output-file ../../sbom/forge-vscode.cdx.json

      - name: 📤 Publicar SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forge-sbom-cyclonedx
          if-no-files-found: error
          path: |
            crates/*/*.cdx.json
            sbom/*.cdx.json

  # ── Build Release ──────────────────────────────────────────
  release-build:
    name: 📦 Release Build
    runs-on: ${{ matrix.os }}
    needs: [build, supply-chain]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: forge
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: forge.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: forge

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-25
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Setup Node.js (Dashboard HTML)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: forge-dashboard/package-lock.json

      - name: ⚡ Compilar Dashboard Frontend
        working-directory: forge-dashboard
        run: |
          npm ci
          npm run build

      - name: 📦 Build Release
        run: cargo build --release --target ${{ matrix.target }}

      - name: 📤 Subir artefacto
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forge-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}
